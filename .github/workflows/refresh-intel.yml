name: Refresh intelligence data

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: refresh-intelligence
  cancel-in-progress: false

jobs:
  refresh:
    name: Check sources and open a review PR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check monitored sources
        id: refresh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run refresh:intel

      - name: Verify updated data
        if: steps.refresh.outputs.has_changes == 'true'
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Open or update pull request
        if: steps.refresh.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B chore/intel-refresh
          git add data README.md docs
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh threat intelligence data"
          git push -f origin chore/intel-refresh
          pr=$(gh pr list --head chore/intel-refresh --state open --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            gh pr create \
              --base main \
              --head chore/intel-refresh \
              --title "chore: refresh threat intelligence data" \
              --body-file "$RUNNER_TEMP/refresh-pr.md"
          else
            gh pr edit "$pr" --body-file "$RUNNER_TEMP/refresh-pr.md"
          fi

      - name: Open or update review issue
        if: steps.refresh.outputs.requires_review == 'true' || steps.refresh.outputs.has_candidates == 'true' || steps.refresh.outputs.has_errors == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list --state open --search 'in:title "Intelligence refresh review"' --json number --jq '.[0].number')
          if [ -z "$existing" ]; then
            gh issue create \
              --title "Intelligence refresh review" \
              --body-file "$RUNNER_TEMP/refresh-issue.md"
          else
            gh issue comment "$existing" --body-file "$RUNNER_TEMP/refresh-issue.md"
          fi

      - name: Upload refresh summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: refresh-summary
          path: ${{ runner.temp }}/refresh-summary.json
          if-no-files-found: ignore
